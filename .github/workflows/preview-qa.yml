name: Deploy Preview QA to Firebase Hosting

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Bundle
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_ENV_TAG: landing_menthum_preview
          VITE_POSTHOG_DEBUG: false
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
        run: npm run build

      - name: Deploy Preview Channel (QA)
        run: |
          DEPLOY_OUTPUT=$(npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" --expires 2d --token "${{ secrets.FIREBASE_TOKEN }}")
          echo "$DEPLOY_OUTPUT"
          echo "### 🚀 QA Preview Channel Listo (Expira en 2 días)" >> $GITHUB_STEP_SUMMARY
          echo "$DEPLOY_OUTPUT" | grep -i "Channel URL" >> $GITHUB_STEP_SUMMARY || true
